<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mängelliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEEEA;
    --card:#FFFFFF;
    --ink:#1F2426;
    --ink-soft:#5B6366;
    --line:#D8D9D3;
    --yellow:#F4B400;
    --yellow-ink:#3A2E00;
    --red:#C6432E;
    --red-bg:#FBE7E2;
    --green:#3E7D53;
    --green-bg:#E4F1E7;
    --amber:#B8860B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;padding-bottom:100px;}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    padding:16px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin:0 0 2px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  h1 span.count{
    font-family:'Roboto Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
  }
  .subline{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;}

  .backup-row{display:flex;gap:8px;margin-bottom:10px;}
  .backup-row button{
    flex:1;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }

  .searchrow{display:flex;gap:8px;margin-bottom:10px;}
  .searchrow input{
    flex:1;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .searchrow input:focus{outline:2px solid var(--yellow);outline-offset:-1px;}

  .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .filters button{
    flex:none;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .filters button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .list{padding:14px 14px 0;display:flex;flex-direction:column;gap:12px;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{font-family:'Oswald',sans-serif;font-size:18px;color:var(--ink);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    position:relative;
    padding:14px 14px 14px 20px;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:8px;
    background-image:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);
    background-color:transparent;
    border-right:1px dashed var(--line);
  }
  .card.open::before{background-image:repeating-linear-gradient(to bottom, var(--red) 0 6px, transparent 6px 12px);}
  .card.done::before{background-image:repeating-linear-gradient(to bottom, var(--green) 0 6px, transparent 6px 12px);}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .ticket-no{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.5px;
  }
  .card h3{
    font-family:'Oswald',sans-serif;
    font-size:17px;
    font-weight:600;
    margin:2px 0 4px;
    color:var(--ink);
  }
  .meta-row{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .meta-row b{color:var(--ink);font-weight:600;}
  .desc{font-size:13.5px;line-height:1.45;color:var(--ink);margin:6px 0 8px;white-space:pre-wrap;}

  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .badge{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.4px;
    padding:3px 8px;
    border-radius:5px;
  }
  .badge.status-offen{background:var(--red-bg);color:var(--red);}
  .badge.status-behoben{background:var(--green-bg);color:var(--green);}
  .badge.prio-hoch{background:#FDEDD3;color:var(--amber);}
  .badge.prio-mittel{background:#F1F1EC;color:var(--ink-soft);}
  .badge.prio-niedrig{background:#F1F1EC;color:var(--ink-soft);}

  .thumbs{display:grid;grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));gap:8px;margin-bottom:10px;}
  .thumbs img{
    width:100%;aspect-ratio:1/1;object-fit:cover;
    border-radius:8px;border:1px solid var(--line);
    cursor:pointer;
  }

  .card-actions{display:flex;gap:8px;}
  .card-actions button{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
  }
  .card-actions button.danger{color:var(--red);}
  .card-actions button.toggle{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .fab{
    position:fixed;
    right:18px;bottom:22px;
    width:58px;height:58px;
    border-radius:50%;
    background:var(--yellow);
    color:var(--yellow-ink);
    border:none;
    font-size:30px;
    line-height:58px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    cursor:pointer;
    z-index:30;
  }
  .fab-export{
    position:fixed;
    right:18px;bottom:90px;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-size:18px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    cursor:pointer;
    z-index:30;
    display:flex;align-items:center;justify-content:center;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,20,18,0.55);
    display:none;
    align-items:flex-end;
    z-index:100;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--paper);
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:18px 18px 26px;
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-head h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:19px;margin:0;}
  .sheet-head button{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:4px;}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;text-transform:uppercase;letter-spacing:0.3px;}
  input[type=text], textarea, select{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  textarea{min-height:80px;resize:vertical;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--yellow);outline-offset:-1px;}

  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}

  .photo-add{
    display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;
  }
  .photo-thumb{position:relative;width:90px;height:90px;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .photo-thumb button{
    position:absolute;top:-6px;right:-6px;
    width:20px;height:20px;border-radius:50%;
    background:var(--red);color:#fff;border:none;
    font-size:12px;line-height:20px;text-align:center;padding:0;cursor:pointer;
  }
  .add-photo-btn{
    width:90px;height:90px;border-radius:8px;
    border:1.5px dashed var(--line);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;color:var(--ink-soft);
    cursor:pointer;
  }
  input[type=file]{display:none;}

  .save-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    background:var(--yellow);
    color:var(--yellow-ink);
    border:none;
    border-radius:10px;
    font-family:'Oswald',sans-serif;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:600;
    cursor:pointer;
  }

  .settings-fields{display:flex;flex-direction:column;}
  .checkbox-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 0;font-size:14.5px;color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .checkbox-row input{width:18px;height:18px;accent-color:var(--yellow);}

  input[type=range]{width:100%;accent-color:var(--yellow);margin:6px 0 4px;}

  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,0.9);
    display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px;}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s;
    z-index:300;
  }
  .toast.show{opacity:1;}

  /* Print */
  @media print{
    .topbar,.fab,.fab-export,.card-actions{display:none !important;}
    body{padding:0;background:#fff;}
    .card{break-inside:avoid;border:1px solid #999;}
    .card::before{display:none;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="topbar">
  <h1>Mängelliste <span class="count" id="countLabel"></span></h1>
  <p class="subline">Alle Einträge werden automatisch auf diesem Gerät gespeichert. <b>Bitte regelmäßig sichern</b> – der Gerätespeicher kann sich unter iOS von selbst leeren.</p>
  <div class="backup-row">
    <button id="exportBackupBtn">⬇ Sichern</button>
    <button id="importBackupBtn">⬆ Wiederherstellen</button>
    <input type="file" id="importFileInput" accept="application/json" hidden>
  </div>
  <div class="searchrow">
    <input type="text" id="searchInput" placeholder="Suchen nach Ort, Bezeichnung, Beschreibung...">
  </div>
  <div class="filters" id="filterRow">
    <button data-f="alle" class="active">Alle</button>
    <button data-f="offen">Offen</button>
    <button data-f="behoben">Behoben</button>
  </div>
</div>

<div class="list" id="listContainer"></div>

<button class="fab-export" id="exportBtn" title="PDF-Bericht / Einstellungen">⎙</button>
<button class="fab" id="addBtn" title="Neuer Mangel">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheetTitle">Neuer Mangel</h2>
      <button id="closeSheet">✕</button>
    </div>

    <label>Bezeichnung *</label>
    <input type="text" id="f_title" placeholder="z. B. Riss in der Fliese">

    <div class="row2">
      <div>
        <label>Ort</label>
        <input type="text" id="f_ort" placeholder="z. B. Badezimmer, EG">
      </div>
      <div>
        <label>Position</label>
        <input type="text" id="f_position" placeholder="z. B. Wand links, 1m Höhe">
      </div>
    </div>

    <label>Beschreibung</label>
    <textarea id="f_beschreibung" placeholder="Was ist zu sehen, wie ist der Zustand..."></textarea>

    <div class="row2">
      <div>
        <label>Status</label>
        <select id="f_status">
          <option value="offen">Offen</option>
          <option value="behoben">Behoben</option>
        </select>
      </div>
      <div>
        <label>Priorität</label>
        <select id="f_prio">
          <option value="niedrig">Niedrig</option>
          <option value="mittel" selected>Mittel</option>
          <option value="hoch">Hoch</option>
        </select>
      </div>
    </div>

    <label>Fotos</label>
    <div class="photo-add" id="photoAdd">
      <label class="add-photo-btn" for="fileInput">＋</label>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" multiple>

    <button class="save-btn" id="saveBtn">Speichern</button>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>PDF-Bericht</h2>
      <button id="closeSettingsSheet">✕</button>
    </div>

    <label>Felder im Bericht</label>
    <div class="settings-fields">
      <label class="checkbox-row"><input type="checkbox" data-field="ort" checked> Ort</label>
      <label class="checkbox-row"><input type="checkbox" data-field="position" checked> Position</label>
      <label class="checkbox-row"><input type="checkbox" data-field="beschreibung" checked> Beschreibung</label>
      <label class="checkbox-row"><input type="checkbox" data-field="status" checked> Status</label>
      <label class="checkbox-row"><input type="checkbox" data-field="prio" checked> Priorität</label>
      <label class="checkbox-row"><input type="checkbox" data-field="datum" checked> Datum</label>
      <label class="checkbox-row"><input type="checkbox" data-field="fotos" checked> Fotos</label>
    </div>

    <label>Bildgröße im Bericht: <span id="imgSizeLabel">60</span> mm</label>
    <input type="range" id="imgSizeSlider" min="20" max="120" step="5" value="60">
    <p class="subline" style="margin-top:4px;">Hinweis: Der Bericht enthält die Einträge, die aktuell in der Liste sichtbar sind (abhängig von Suche/Filter).</p>

    <button class="save-btn" id="pdfExportBtn">📄 PDF exportieren</button>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'maengel-eintraege';
let entries = [];
let editingId = null;
let currentPhotos = [];
let activeFilter = 'alle';
let seqCounter = 1;

const listEl = document.getElementById('listContainer');
const overlay = document.getElementById('overlay');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasClaudeStorage){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v !== null ? {value: v} : null;
  }catch(e){ return null; }
}

async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ return false; }
  }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

async function loadEntries(){
  try{
    const res = await storageGet(STORAGE_KEY);
    entries = res ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  seqCounter = entries.length ? Math.max(...entries.map(e=>e.seq||0)) + 1 : 1;
  render();
}

async function persist(){
  const ok = await storageSet(STORAGE_KEY, JSON.stringify(entries));
  if(!ok) showToast('Speichern fehlgeschlagen');
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}) + ' · ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

function render(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = entries.filter(e => {
    if(activeFilter !== 'alle' && e.status !== activeFilter) return false;
    if(!search) return true;
    const hay = [e.title, e.ort, e.position, e.beschreibung].join(' ').toLowerCase();
    return hay.includes(search);
  });
  filtered.sort((a,b)=> new Date(b.datum) - new Date(a.datum));

  document.getElementById('countLabel').textContent = entries.length ? `(${entries.length})` : '';

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty"><div class="big">Keine Einträge</div>Tippe unten rechts auf „+“, um einen Mangel zu erfassen.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(e => {
    const thumbs = (e.images||[]).map(src => `<img src="${src}" onclick="openLightbox('${src.replace(/'/g,"")}')">`).join('');
    return `
    <div class="card ${e.status === 'offen' ? 'open' : 'done'}">
      <div class="card-top">
        <div>
          <div class="ticket-no">#${String(e.seq).padStart(3,'0')} · ${fmtDate(e.datum)}</div>
          <h3>${escapeHtml(e.title)}</h3>
        </div>
      </div>
      <div class="meta-row">
        ${e.ort ? `<span><b>Ort:</b> ${escapeHtml(e.ort)}</span>` : ''}
        ${e.position ? `<span><b>Position:</b> ${escapeHtml(e.position)}</span>` : ''}
      </div>
      ${e.beschreibung ? `<div class="desc">${escapeHtml(e.beschreibung)}</div>` : ''}
      <div class="badges">
        <span class="badge status-${e.status}">${e.status === 'offen' ? 'Offen' : 'Behoben'}</span>
        <span class="badge prio-${e.prio}">Priorität: ${e.prio}</span>
      </div>
      ${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}
      <div class="card-actions">
        <button onclick="editEntry('${e.id}')">Bearbeiten</button>
        <button class="toggle" onclick="toggleStatus('${e.id}')">${e.status === 'offen' ? 'Als behoben markieren' : 'Wieder öffnen'}</button>
        <button class="danger" onclick="deleteEntry('${e.id}')">Löschen</button>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').classList.remove('show');
});

function openSheet(entry){
  editingId = entry ? entry.id : null;
  document.getElementById('sheetTitle').textContent = entry ? 'Mangel bearbeiten' : 'Neuer Mangel';
  document.getElementById('f_title').value = entry ? entry.title : '';
  document.getElementById('f_ort').value = entry ? entry.ort : '';
  document.getElementById('f_position').value = entry ? entry.position : '';
  document.getElementById('f_beschreibung').value = entry ? entry.beschreibung : '';
  document.getElementById('f_status').value = entry ? entry.status : 'offen';
  document.getElementById('f_prio').value = entry ? entry.prio : 'mittel';
  currentPhotos = entry ? [...(entry.images||[])] : [];
  renderPhotoAdd();
  overlay.classList.add('show');
}

function closeSheet(){
  overlay.classList.remove('show');
}

function renderPhotoAdd(){
  const container = document.getElementById('photoAdd');
  const thumbsHtml = currentPhotos.map((src, i) => `
    <div class="photo-thumb">
      <img src="${src}">
      <button onclick="removePhoto(${i})">✕</button>
    </div>`).join('');
  container.innerHTML = thumbsHtml + `<label class="add-photo-btn" for="fileInput">＋</label>`;
}

function removePhoto(i){
  currentPhotos.splice(i,1);
  renderPhotoAdd();
}

document.getElementById('fileInput').addEventListener('change', async (ev)=>{
  const files = Array.from(ev.target.files);
  for(const file of files){
    const compressed = await compressImage(file);
    currentPhotos.push(compressed);
  }
  renderPhotoAdd();
  ev.target.value = '';
});

function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 900;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('f_title').value.trim();
  if(!title){ showToast('Bitte eine Bezeichnung eingeben'); return; }

  if(editingId){
    const idx = entries.findIndex(e=>e.id===editingId);
    entries[idx] = {
      ...entries[idx],
      title,
      ort: document.getElementById('f_ort').value.trim(),
      position: document.getElementById('f_position').value.trim(),
      beschreibung: document.getElementById('f_beschreibung').value.trim(),
      status: document.getElementById('f_status').value,
      prio: document.getElementById('f_prio').value,
      images: currentPhotos,
    };
  } else {
    entries.push({
      id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      seq: seqCounter++,
      title,
      ort: document.getElementById('f_ort').value.trim(),
      position: document.getElementById('f_position').value.trim(),
      beschreibung: document.getElementById('f_beschreibung').value.trim(),
      status: document.getElementById('f_status').value,
      prio: document.getElementById('f_prio').value,
      images: currentPhotos,
      datum: new Date().toISOString(),
    });
  }
  await persist();
  closeSheet();
  render();
  showToast('Gespeichert');
});

function editEntry(id){
  const e = entries.find(x=>x.id===id);
  if(e) openSheet(e);
}

async function toggleStatus(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  e.status = e.status === 'offen' ? 'behoben' : 'offen';
  await persist();
  render();
}

async function deleteEntry(id){
  if(!confirm('Diesen Eintrag wirklich löschen?')) return;
  entries = entries.filter(x=>x.id!==id);
  await persist();
  render();
  showToast('Gelöscht');
}

async function exportBackup(){
  if(entries.length === 0){ showToast('Keine Einträge zum Sichern vorhanden'); return; }
  const dataStr = JSON.stringify(entries, null, 2);
  const filename = `maengelliste-sicherung-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([dataStr], {type:'application/json'});

  if(navigator.canShare){
    try{
      const file = new File([blob], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Mängelliste Sicherung'});
        return;
      }
    }catch(e){ /* Nutzer hat Teilen abgebrochen oder nicht unterstützt -> Fallback unten */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Sicherung wird gespeichert');
}

document.getElementById('importFileInput').addEventListener('change', async (ev)=>{
  const file = ev.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('invalid');
    const replace = confirm(`${imported.length} Einträge in der Sicherung gefunden.\n\nOK = alle aktuellen Einträge damit ersetzen\nAbbrechen = mit vorhandenen Einträgen zusammenführen`);
    if(replace){
      entries = imported;
    } else {
      const existingIds = new Set(entries.map(e=>e.id));
      imported.forEach(e=>{ if(!existingIds.has(e.id)) entries.push(e); });
    }
    seqCounter = entries.length ? Math.max(...entries.map(e=>e.seq||0)) + 1 : 1;
    await persist();
    render();
    showToast('Sicherung wiederhergestellt');
  }catch(e){
    showToast('Datei konnte nicht gelesen werden');
  }
  ev.target.value = '';
});

document.getElementById('exportBackupBtn').addEventListener('click', exportBackup);
document.getElementById('importBackupBtn').addEventListener('click', ()=>document.getElementById('importFileInput').click());

document.getElementById('addBtn').addEventListener('click', ()=>openSheet(null));
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('searchInput').addEventListener('input', render);
const SETTINGS_KEY = 'maengel-einstellungen';
let settings = {
  fields: {ort:true, position:true, beschreibung:true, status:true, prio:true, datum:true, fotos:true},
  imageSizeMM: 60
};

async function loadSettings(){
  try{
    const res = await storageGet(SETTINGS_KEY);
    if(res){
      const loaded = JSON.parse(res.value);
      settings = { fields: {...settings.fields, ...(loaded.fields||{})}, imageSizeMM: loaded.imageSizeMM || settings.imageSizeMM };
    }
  }catch(e){}
}

async function persistSettings(){
  await storageSet(SETTINGS_KEY, JSON.stringify(settings));
}

function applySettingsToUI(){
  document.querySelectorAll('#settingsOverlay input[type=checkbox]').forEach(cb=>{
    cb.checked = !!settings.fields[cb.dataset.field];
  });
  document.getElementById('imgSizeSlider').value = settings.imageSizeMM;
  document.getElementById('imgSizeLabel').textContent = settings.imageSizeMM;
}

function openSettings(){
  applySettingsToUI();
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('show');
}

document.getElementById('exportBtn').addEventListener('click', openSettings);
document.getElementById('closeSettingsSheet').addEventListener('click', closeSettings);

document.querySelectorAll('#settingsOverlay input[type=checkbox]').forEach(cb=>{
  cb.addEventListener('change', ()=>{
    settings.fields[cb.dataset.field] = cb.checked;
    persistSettings();
  });
});

const imgSizeSlider = document.getElementById('imgSizeSlider');
imgSizeSlider.addEventListener('input', ()=>{
  document.getElementById('imgSizeLabel').textContent = imgSizeSlider.value;
});
imgSizeSlider.addEventListener('change', ()=>{
  settings.imageSizeMM = parseInt(imgSizeSlider.value, 10);
  persistSettings();
});

function getExportEntries(){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = entries.filter(e => {
    if(activeFilter !== 'alle' && e.status !== activeFilter) return false;
    if(!search) return true;
    const hay = [e.title, e.ort, e.position, e.beschreibung].join(' ').toLowerCase();
    return hay.includes(search);
  });
  filtered.sort((a,b)=> new Date(b.datum) - new Date(a.datum));
  return filtered;
}

async function exportPDF(){
  if(typeof window.jspdf === 'undefined'){
    showToast('PDF-Funktion konnte nicht geladen werden (keine Internetverbindung?)');
    return;
  }
  const list = getExportEntries();
  if(list.length === 0){ showToast('Keine Einträge zum Exportieren'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageWidth = 210, pageHeight = 297, margin = 15, maxWidth = pageWidth - margin*2;
  let y = margin;

  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  doc.text('Mängelliste', margin, y); y += 8;
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(new Date().toLocaleDateString('de-DE') + ' · ' + list.length + ' Einträge', margin, y);
  doc.setTextColor(0);
  y += 10;

  const imgSize = settings.imageSizeMM;

  list.forEach((e) => {
    if(y > pageHeight - margin - 20){ doc.addPage(); y = margin; }

    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    const titleLines = doc.splitTextToSize(`#${String(e.seq).padStart(3,'0')} – ${e.title}`, maxWidth);
    titleLines.forEach(l => { doc.text(l, margin, y); y += 6; });

    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const infoLine = [];
    if(settings.fields.ort && e.ort) infoLine.push(`Ort: ${e.ort}`);
    if(settings.fields.position && e.position) infoLine.push(`Position: ${e.position}`);
    if(infoLine.length){
      const wrapped = doc.splitTextToSize(infoLine.join('   ·   '), maxWidth);
      wrapped.forEach(l => { doc.text(l, margin, y); y += 5; });
    }
    const metaLine = [];
    if(settings.fields.status) metaLine.push(`Status: ${e.status === 'offen' ? 'Offen' : 'Behoben'}`);
    if(settings.fields.prio) metaLine.push(`Priorität: ${e.prio}`);
    if(settings.fields.datum) metaLine.push(`Datum: ${fmtDate(e.datum)}`);
    if(metaLine.length){
      doc.text(metaLine.join('   ·   '), margin, y); y += 6;
    }

    if(settings.fields.beschreibung && e.beschreibung){
      const wrapped = doc.splitTextToSize(e.beschreibung, maxWidth);
      wrapped.forEach(line => {
        if(y > pageHeight - margin){ doc.addPage(); y = margin; }
        doc.text(line, margin, y); y += 5;
      });
      y += 1;
    }

    if(settings.fields.fotos && e.images && e.images.length){
      y += 2;
      let x = margin;
      let rowMaxY = y;
      e.images.forEach((src) => {
        if(x + imgSize > pageWidth - margin){ x = margin; y = rowMaxY + 4; }
        if(y + imgSize > pageHeight - margin){ doc.addPage(); y = margin; x = margin; }
        try{ doc.addImage(src, 'JPEG', x, y, imgSize, imgSize); }catch(err){}
        x += imgSize + 4;
        rowMaxY = Math.max(rowMaxY, y + imgSize);
      });
      y = rowMaxY + 6;
    }

    y += 3;
    if(y > pageHeight - margin){ doc.addPage(); y = margin; }
    else{
      doc.setDrawColor(210);
      doc.line(margin, y, pageWidth - margin, y);
      y += 7;
    }
  });

  doc.save(`maengelliste-${new Date().toISOString().slice(0,10)}.pdf`);
  closeSettings();
}

document.getElementById('pdfExportBtn').addEventListener('click', exportPDF);

document.getElementById('filterRow').addEventListener('click', (ev)=>{
  if(ev.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filterRow button').forEach(b=>b.classList.remove('active'));
  ev.target.classList.add('active');
  activeFilter = ev.target.dataset.f;
  render();
});

loadEntries();
loadSettings();
</script>
